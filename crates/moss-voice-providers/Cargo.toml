[package]
name = "moss-voice-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MOSS 内置语音服务的模型提供方（内置语音技术书 NV3 起）：ASR / LLM / TTS 接口与 OpenAI 兼容、本地模型、豆包流式实现，以及切句、Markdown 清洗、对话历史截断、WAV 编解码、重采样等纯函数。仅桌面端使用。"

[dependencies]
serde.workspace = true
base64.workspace = true
serde_json.workspace = true
# 异步客户端：在内置语音服务的专用 tokio 运行时中调用；与仓库其他 crate 相同使用 rustls，不跟随重定向由代码设置
reqwest = { workspace = true, features = ["json", "rustls"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "net", "macros"] }
# 本地模型辅助程序的帧协议（NV6）
moss-voice-local-proto = { path = "../moss-voice-local-proto" }
moss-process = { path = "../moss-process" }
# 豆包流式识别与合成（NV7）：WebSocket 客户端与 axum 共用 tokio-tungstenite 0.29；TLS 用 rustls（明确指定 ring 与内置根证书）
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
rustls.workspace = true
webpki-roots.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
# 豆包识别帧的 gzip 压缩
flate2.workspace = true
getrandom.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[lints]
workspace = true
