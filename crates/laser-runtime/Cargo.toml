[package]
name = "laser-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
laser-contracts = { path = "../laser-contracts" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
fs4 = "0.13"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tempfile = "3"
