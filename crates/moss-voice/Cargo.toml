[package]
name = "moss-voice"
version = "0.3.7"
edition = "2024"
description = "语音中心（技术书 §9.4，P4）：自建 xiaozhi-server 的设置、进程管理、日志与模型配置。仅桌面端使用，不进入 laser-api / moss-host / Android。"

[dependencies]
laser-contracts = { path = "../laser-contracts" }
moss-mcp-client = { path = "../moss-mcp-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 模型“测试连接”与接入点健康检查（与 laser-api 相同的 reqwest 配置：阻塞、rustls、不跟随重定向由代码设置）
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# 写入服务端 data/.config.yaml 后重新解析校验
serde_yaml = "0.9"
# 本地模型下载（NV6）：SHA-256 校验与 tar.bz2 解压（纯 Rust 的 bzip2 后端，不需要 C 编译器）
sha2 = "0.10"
tar = "0.4"
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
flate2 = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Job Object：MOSS 退出（含异常退出）时连同服务端子进程树一起结束，不留孤儿进程
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
