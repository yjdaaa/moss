[package]
name = "moss-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "语音中心（技术书 §9.4，P4）：语音链路（官方小智 / MOSS 内置服务）设置、内置服务模型配置与本地模型。仅桌面端使用，不进入 laser-api / moss-host / Android。"

[dependencies]
laser-contracts = { path = "../laser-contracts" }
laser-runtime = { path = "../laser-runtime" }
moss-mcp-client = { path = "../moss-mcp-client" }
moss-process = { path = "../moss-process" }
serde.workspace = true
serde_json.workspace = true
# 模型“测试连接”（与 laser-api 相同的 reqwest 配置：阻塞、rustls、不跟随重定向由代码设置）
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
# 本地模型下载（NV6）：SHA-256 校验与 tar.bz2 解压（纯 Rust 的 bzip2 后端，不需要 C 编译器）
sha2.workspace = true
tar.workspace = true
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
flate2.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
