[package]
name = "laser-host"
version = "0.3.7"
edition = "2024"

[dependencies]
laser-contracts = { path = "../laser-contracts" }
laser-core = { path = "../laser-core" }
laser-runtime = { path = "../laser-runtime" }
laser-device = { path = "../laser-device" }
laser-api = { path = "../laser-api" }
laser-mcp = { path = "../laser-mcp" }
laser-tools = { path = "../laser-tools" }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
moss-mcp-client = { path = "../moss-mcp-client" }
moss-voice = { path = "../moss-voice" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects",
    "Win32_System_Threading", "Win32_System_Pipes",
] }

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
libc = "0.2"

[dev-dependencies]
# 测试不读写 macOS 真实登录钥匙串（见 laser-runtime 的 test-memory-secret-store）
laser-runtime = { path = "../laser-runtime", features = ["test-memory-secret-store"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
