[package]
name = "laser-api"
version = "0.2.0"
edition = "2024"

[dependencies]
rust-embed = "8"
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"
hex = "0.4"
sha2 = "0.10"
getrandom = "0.3"
image = "0.25"
laser-contracts = { path = "../laser-contracts" }
laser-runtime = { path = "../laser-runtime" }
laser-core = { path = "../laser-core" }
laser-device = { path = "../laser-device" }
laser-tools = { path = "../laser-tools" }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

[dev-dependencies]
tempfile = "3"
