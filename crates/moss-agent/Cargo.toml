[package]
name = "moss-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NV13 本机 Agent（Claude Code / Codex）执行：CLI 识别、受限进程运行器、桌面单次审批桥"

[dependencies]
laser-contracts = { path = "../laser-contracts" }
laser-runtime = { path = "../laser-runtime" }
laser-api = { path = "../laser-api" }
moss-voice = { path = "../moss-voice" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects",
    "Win32_System_Threading", "Win32_System_Pipes",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 测试不读写 macOS 真实登录钥匙串（见 laser-runtime 的 test-memory-secret-store）
laser-runtime = { path = "../laser-runtime", features = ["test-memory-secret-store"] }
# 仅离线测试夹具（model_proxy / docker_plan）使用
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
getrandom.workspace = true
rcgen.workspace = true
rustls.workspace = true
tempfile.workspace = true

[lints]
workspace = true
