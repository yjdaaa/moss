[package]
name = "moss-voice-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MOSS 内置语音服务（内置语音技术书 NV1 起）：小智设备的 OTA 与 WebSocket 服务、设备允许流程、会话。仅桌面端使用，不进入 laser-api / moss-host / Android。"

[dependencies]
moss-xiaozhi-display = { path = "../moss-xiaozhi-display" }
moss-xiaozhi-proto = { path = "../moss-xiaozhi-proto" }
moss-voice-providers = { path = "../moss-voice-providers" }
serde.workspace = true
serde_json.workspace = true
# 专用运行时：只在启用内置语音时创建，与 MOSS 现有线程模型隔离（技术书 §4）
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
axum = { workspace = true, features = ["ws", "multipart"] }
# 资源包分块下发：最后一块交给连接后才算“设备下载完”（2026-11-09）
futures-util = { workspace = true, features = ["std"] }
image = { workspace = true, features = ["png", "jpeg", "gif"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "ogg", "vorbis", "pcm"] }
sha2.workspace = true
getrandom.workspace = true
chrono = { workspace = true, features = ["clock"] }
# Opus 编解码：官方参考实现 libopus（随源码编译，需要 CMake 与 C 编译器）。
# 2026-11-14 n94：原纯 Rust 后端 mousiki 0.2.1 的语音（SILK / 混合）模式与 libopus 不兼容——
# 它编出的下行被设备（libopus 解码）放大到 2–10 倍并削顶，设备上行它又解码不对，详见技术书 n94。
opus2 = { version = "0.4", default-features = false, features = ["backend-libopus", "static", "bundled"] }
# n71 常连模式：小智 MQTT + UDP 语音通道的 AES-128-CTR（与官方固件 mbedTLS/PSA CTR 一致）
aes = "0.8"
ctr = "0.9"

# NV11 bounded, non-redirecting external information adapters; no device/network side effects in tests.
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
quick-xml = "=0.42.0"
lunar_rust = "=1.0.1"
mdns-sd.workspace = true
if-addrs.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
moss-xiaozhi-display = { path = "../moss-xiaozhi-display", features = ["test-fixtures"] }
rcgen.workspace = true
# NV19-02: reference store adapter over the real schema v10 (test only; no runtime dependency).
laser-runtime = { path = "../laser-runtime", features = ["test-sql-access"] }
rustls.workspace = true
moss-voice-local-proto = { path = "../moss-voice-local-proto" }
# 链路实测与桌面端用同一份热词 / 内置同音纠错（test only）
moss-voice = { path = "../moss-voice" }
tempfile.workspace = true
tungstenite = { workspace = true, features = ["handshake"] }

[lints]
workspace = true
