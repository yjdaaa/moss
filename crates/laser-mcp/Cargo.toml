[package]
name = "laser-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
laser-tools = { path = "../laser-tools" }
laser-contracts = { path = "../laser-contracts" }
serde.workspace = true
serde_json.workspace = true
# 小智 MCP_ENDPOINT 为 wss://，同步客户端 + rustls（ring）+ 内置根证书，无需系统 OpenSSL
tungstenite = { workspace = true, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls.workspace = true
# 接入点身份显示（NV8）：解码 token 中 JWT 的载荷部分（只读字段，不校验签名）
base64.workspace = true

[dev-dependencies]
# 测试核对工具 schema 里的枚举与 laser-core 的取值一致
laser-core = { path = "../laser-core" }

[lints]
workspace = true
