[package]
name = "moss-mcp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NV9 third-party MCP client foundation; explicit configuration and fail-closed authorization. Used by laser-host::external_mcp for the voice center third-party MCP integration."
publish = false

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
process-wrap = { version = "10.0", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "job-object", "creation-flags"] }
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "process", "sync"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_System_Threading"] }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "test-util"] }

[lints]
workspace = true
