[package]
name = "moss-home"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NV15 Home Assistant 家居控制：白名单策略、逐次桌面审批、HTTPS 传输与结果核验"

[dependencies]
laser-contracts = { path = "../laser-contracts" }
laser-runtime = { path = "../laser-runtime" }
laser-api = { path = "../laser-api" }
moss-voice = { path = "../moss-voice" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }

[dev-dependencies]
# 集成测试借用完整宿主组装运行目录与审批服务
laser-host = { path = "../laser-host" }
# 测试不读写 macOS 真实登录钥匙串（见 laser-runtime 的 test-memory-secret-store）
laser-runtime = { path = "../laser-runtime", features = ["test-memory-secret-store"] }
rcgen.workspace = true
rustls.workspace = true
tempfile.workspace = true

[lints]
workspace = true
