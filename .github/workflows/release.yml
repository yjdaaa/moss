name: MOSS Parallel Release

# Magpie-style zero-local-wait release pipeline:
# Push any `v*` tag (e.g. via `powershell -File scripts/release-tag.ps1`) ->
# Frontend builds ONCE + native-license gate evaluates voice sidecar eligibility ->
# Eligible targets compile in PARALLEL on cloud runners -> assets + SHA256SUMS publish to GitHub Releases automatically.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建发布的已有 Git 标签（如 v0.3.1）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: 1. Prepare Version, License Gate & Frontend Dist
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sidecar_release_ready: ${{ steps.license_gate.outputs.ready }}
    steps:
      - name: Resolve tag and semantic version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version derived from tag '$TAG': '$VERSION'" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=$TAG version=$VERSION"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Evaluate native-license release gate for voice sidecar
        id: license_gate
        run: |
          if node scripts/voice-helper/check-sidecar-license-gate.mjs --platform macos --require-complete; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Sidecar native-license release gate PASSED."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sidecar native-license audit is incomplete (docs/developer/safety.md); withholding offline-voice sidecar artifacts while ordinary packages continue releasing."
          fi

      - name: Build frontend once
        env:
          MOSS_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload shared frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: release-frontend-dist
          path: frontend/dist
          retention-days: 3

  windows-lite:
    name: 2a. Windows Lite & Portable (x64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download shared frontend dist
        uses: actions/download-artifact@v4
        with:
          name: release-frontend-dist
          path: frontend/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build Windows Lite NSIS & Portable EXE
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MOSS_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          # 应用内更新签名私钥（仓库密钥，未配置时不生成更新包，只发普通安装包）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $overlay = Join-Path $env:RUNNER_TEMP "tauri-lite-overlay.json"
          $bundle = @{}
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { $bundle.createUpdaterArtifacts = $true }
          @{
            version = $env:VERSION
            build   = @{ beforeBuildCommand = "" }
            bundle  = $bundle
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $overlay -Encoding utf8

          Push-Location apps/desktop/src-tauri
          try {
            cargo tauri build --bundles nsis --config $overlay
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

          if (Test-Path -LiteralPath "target/release/moss-voice-local.exe") {
            throw "Unexpected unaudited voice helper binary in windows-lite target directory"
          }

          New-Item -ItemType Directory -Path target/release-assets -Force | Out-Null
          $nsis = Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter "*.exe" -File |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $nsis) { throw "Missing Windows Lite NSIS installer" }

          Copy-Item -LiteralPath $nsis.FullName -Destination "target/release-assets/MOSS_${env:VERSION}_x64-lite-setup.exe" -Force
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Copy-Item -LiteralPath "$($nsis.FullName).sig" -Destination "target/release-assets/MOSS_${env:VERSION}_x64-lite-setup.exe.sig" -Force
          }
          Copy-Item -LiteralPath "target/release/moss-desktop.exe" -Destination "target/release-assets/MOSS_${env:VERSION}_windows_x64_portable.exe" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: asset-windows-lite
          path: target/release-assets/*
          retention-days: 3

  windows-offline-voice:
    name: 2b. Windows Offline Voice Bundle (x64, License-Gated)
    needs: prepare
    if: needs.prepare.outputs.sidecar_release_ready == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download shared frontend dist
        uses: actions/download-artifact@v4
        with:
          name: release-frontend-dist
          path: frontend/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-main-ws

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Enforce native-license release gate & build Offline-Voice NSIS
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MOSS_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo clean --manifest-path apps/moss-voice-local/Cargo.toml --target-dir target 2>$null
          New-Item -ItemType Directory -Path target/release-assets -Force | Out-Null
          $srcZip = (Resolve-Path target/release-assets).Path + "\moss-voice-local-${env:VERSION}-gpl-source.zip"
          powershell -File scripts/voice-helper/build-sidecar-installer.ps1 `
            -SkipFrontendBuild `
            -VersionOverride $env:VERSION `
            -EmitGplSourceZip $srcZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $nsis = Get-ChildItem -LiteralPath target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter "*.exe" -File |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $nsis) { throw "Missing Windows Offline-Voice NSIS installer" }

          Copy-Item -LiteralPath $nsis.FullName -Destination "target/release-assets/MOSS_${env:VERSION}_x64-offline-voice-setup.exe" -Force
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Copy-Item -LiteralPath "$($nsis.FullName).sig" -Destination "target/release-assets/MOSS_${env:VERSION}_x64-offline-voice-setup.exe.sig" -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: asset-windows-offline-voice
          path: target/release-assets/*
          retention-days: 3

  macos-universal:
    name: 2c. macOS Universal DMG (Apple Silicon + Intel)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download shared frontend dist
        uses: actions/download-artifact@v4
        with:
          name: release-frontend-dist
          path: frontend/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-main-ws

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build Universal macOS .app & .dmg
        env:
          MOSS_MACOS_TARGET: universal-apple-darwin
          MOSS_SKIP_FRONTEND_BUILD: '1'
          MOSS_VERSION_OVERRIDE: ${{ needs.prepare.outputs.version }}
          MOSS_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SIDECAR_READY: ${{ needs.prepare.outputs.sidecar_release_ready }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: 'true'
        run: |
          if [[ "$SIDECAR_READY" == "true" ]]; then
            node scripts/voice-helper/check-sidecar-license-gate.mjs --platform macos --require-complete
            cargo clean --manifest-path apps/moss-voice-local/Cargo.toml --target-dir target || true
            bash scripts/build-macos-installer.sh --with-voice-sidecar
            test -x "target/universal-apple-darwin/release/bundle/macos/MOSS.app/Contents/MacOS/moss-voice-local"
          else
            # 门禁未通过前仅产普通 DMG，不生成/上传 darwin 应用内更新包，防止旧含 helper 安装被整体替换后丢失离线语音
            TAURI_SIGNING_PRIVATE_KEY="" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
              bash scripts/build-macos-installer.sh --without-voice-sidecar
            APP_BUNDLE="target/universal-apple-darwin/release/bundle/macos/MOSS.app"
            if [[ -e "$APP_BUNDLE/Contents/MacOS/moss-voice-local" || -e "$APP_BUNDLE/Contents/Resources/licenses/voice-local" ]]; then
              echo "::error::Unaudited voice sidecar leaked into ordinary macOS bundle" >&2
              exit 1
            fi
          fi
          mkdir -p target/release-assets
          DMG_SRC="$(ls -t target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)"
          cp "$DMG_SRC" "target/release-assets/MOSS_${MOSS_VERSION_OVERRIDE}_macos_universal.dmg"
          if [[ "$SIDECAR_READY" == "true" && -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            UPD_SRC="target/universal-apple-darwin/release/bundle/macos/MOSS.app.tar.gz"
            test -s "$UPD_SRC" && test -s "$UPD_SRC.sig"
            cp "$UPD_SRC" "target/release-assets/MOSS_${MOSS_VERSION_OVERRIDE}_macos_universal.app.tar.gz"
            cp "$UPD_SRC.sig" "target/release-assets/MOSS_${MOSS_VERSION_OVERRIDE}_macos_universal.app.tar.gz.sig"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: asset-macos-universal
          path: target/release-assets/*
          retention-days: 3

  android-apk:
    name: 2d. Android Signed APK (arm64)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download shared frontend dist
        uses: actions/download-artifact@v4
        with:
          name: release-frontend-dist
          path: frontend/dist

      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Configure Android fixed release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 正式发布必须使用固定签名证书（docs/developer/packaging-install.md §3.8）；缺任一密钥直接失败，绝不退回临时证书。
          if [[ -z "${KEYSTORE_B64// }" || -z "${KEY_ALIAS// }" || -z "${KEY_PASSWORD// }" ]]; then
            echo "::error::Android release requires fixed signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi
          ANDROID_DIR="apps/desktop/src-tauri/gen/android"
          KS_FILE="$RUNNER_TEMP/moss-release.jks"
          echo "$KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > "$KS_FILE"
          if [[ ! -s "$KS_FILE" ]]; then
            echo "::error::Decoded ANDROID_KEYSTORE_BASE64 file is empty." >&2
            exit 1
          fi
          chmod 600 "$KS_FILE"
          if ! keytool -list -keystore "$KS_FILE" -alias "$KEY_ALIAS" -storepass "$KEY_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Failed to validate ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD with keytool." >&2
            exit 1
          fi
          CERT_FILE="$RUNNER_TEMP/moss-release-signing-cert.der"
          keytool -exportcert -keystore "$KS_FILE" -alias "$KEY_ALIAS" -storepass "$KEY_PASSWORD" -file "$CERT_FILE"
          test -s "$CERT_FILE"
          CERT_SHA256="$(sha256sum "$CERT_FILE" | awk '{print $1}')"
          if [[ ! "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Cannot derive Android release certificate SHA-256." >&2
            exit 1
          fi
          printf 'MOSS_ANDROID_EXPECTED_CERT_SHA256=%s\n' "$CERT_SHA256" >> "$GITHUB_ENV"

          cat > "$ANDROID_DIR/keystore.properties" <<EOF
          storeFile=$KS_FILE
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          EOF
          chmod 600 "$ANDROID_DIR/keystore.properties"
          echo "MOSS_REQUIRE_ANDROID_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          echo "Verified repository fixed Android release keystore for alias '$KEY_ALIAS'."

      - name: Build Android arm64 Release APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MOSS_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'
        run: |
          OVERLAY="$RUNNER_TEMP/tauri-android-overlay.json"
          python3 - "$OVERLAY" "$VERSION" <<'PY'
          import json, sys
          path, ver = sys.argv[1:3]
          parts = [int(x) for x in ver.split("-")[0].split(".")[:3]]
          while len(parts) < 3:
              parts.append(0)
          version_code = max(1, parts[0] * 1000000 + parts[1] * 1000 + parts[2])
          with open(path, "w", encoding="utf-8") as fp:
              json.dump({
                  "version": ver,
                  "build": {"beforeBuildCommand": ""},
                  "bundle": {"android": {"versionCode": version_code}},
              }, fp)
          PY

          pushd apps/desktop/src-tauri >/dev/null
          cargo tauri android build --target aarch64 --apk --ci --config "$OVERLAY"
          popd >/dev/null

          mkdir -p target/release-assets
          APK_SRC="apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          test -s "$APK_SRC"
          APKSIGNER="$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::Android apksigner is required for release verification." >&2
            exit 1
          fi
          EXPECTED_SHA256="${MOSS_ANDROID_EXPECTED_CERT_SHA256:-}"
          SIGNING_INFO="$("$APKSIGNER" verify --print-certs "$APK_SRC")"
          ACTUAL_SHA256="$(printf '%s\n' "$SIGNING_INFO" | awk -F': ' '/^Signer #[0-9]+ certificate SHA-256 digest: / {print tolower($2)}')"
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ || "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::APK signer does not match the configured Android release certificate." >&2
            exit 1
          fi
          cp "$APK_SRC" "target/release-assets/MOSS_${VERSION}_android_aarch64.apk"
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            cargo tauri signer sign --app-version "$VERSION" "target/release-assets/MOSS_${VERSION}_android_aarch64.apk"
            test -s "target/release-assets/MOSS_${VERSION}_android_aarch64.apk.sig"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: asset-android-apk
          path: target/release-assets/*
          retention-days: 3

  publish:
    name: 3. Publish GitHub Release
    needs:
      - prepare
      - windows-lite
      - windows-offline-voice
      - macos-universal
      - android-apk
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.windows-lite.result == 'success' &&
      needs.macos-universal.result == 'success' &&
      needs.android-apk.result == 'success' &&
      (needs.windows-offline-voice.result == 'success' || needs.windows-offline-voice.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SIDECAR_READY: ${{ needs.prepare.outputs.sidecar_release_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download all platform release assets
        uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      - name: Generate in-app update manifest (latest.json)
        run: |
          # 应用内更新清单（2026-11-07）：按实际构建与门禁产物生成 latest.json；
          # 门禁未通过时不生成 darwin-aarch64 / darwin-x86_64 与 windows-x86_64-offline-voice（防止旧含 helper 安装替换丢离线语音），仅生成 windows-x86_64-lite 与 android-aarch64。
          # BEGIN LATEST_JSON_GENERATOR
          python3 - "$VERSION" "$TAG" "$GITHUB_REPOSITORY" "$SIDECAR_READY" <<'PY'
          import datetime, json, pathlib, sys

          ver, tag, repo, sidecar_ready = sys.argv[1:5]
          dist = pathlib.Path("dist")
          base = f"https://github.com/{repo}/releases/download/{tag}/"

          if sidecar_ready != "true":
              forbidden = sorted(
                  p.name for p in dist.iterdir()
                  if "offline-voice" in p.name or "gpl-source" in p.name or ".app.tar.gz" in p.name
              )
              if forbidden:
                  raise SystemExit(
                      f"Sidecar license gate is incomplete, refusing to publish sidecar or darwin updater files: {forbidden}"
                  )
          else:
              required_sidecar = [
                  f"MOSS_{ver}_x64-offline-voice-setup.exe",
                  f"moss-voice-local-{ver}-gpl-source.zip",
              ]
              missing_sidecar = [name for name in required_sidecar if not (dist / name).is_file()]
              if missing_sidecar:
                  raise SystemExit(f"Sidecar gate passed, but expected sidecar assets are missing: {missing_sidecar}")

          desktop_packages = {
              "windows-x86_64-lite": f"MOSS_{ver}_x64-lite-setup.exe",
          }
          if sidecar_ready == "true":
              desktop_packages["windows-x86_64-offline-voice"] = f"MOSS_{ver}_x64-offline-voice-setup.exe"
              desktop_packages["darwin-aarch64"] = f"MOSS_{ver}_macos_universal.app.tar.gz"
              desktop_packages["darwin-x86_64"] = f"MOSS_{ver}_macos_universal.app.tar.gz"

          android_apk = f"MOSS_{ver}_android_aarch64.apk"
          signatures = {path.name[:-4]: path.read_text(encoding="utf-8").strip() for path in dist.glob("*.sig")}
          for sig in dist.glob("*.sig"):
              sig.unlink()  # 签名写进清单，不单独上传，也不进 SHA256SUMS

          if not signatures:
              (dist / f"MOSS_{ver}_macos_universal.app.tar.gz").unlink(missing_ok=True)
              print("::notice::未配置 TAURI_SIGNING_PRIVATE_KEY，本次不发布应用内更新清单")
              sys.exit(0)

          expected_desktop = sorted(set(desktop_packages.values()))
          missing = [name for name in expected_desktop if name not in signatures or not (dist / name).is_file()]
          if missing:
              raise SystemExit(f"应用内更新签名不完整，缺少桌面签名或文件：{missing}")

          if android_apk not in signatures or not (dist / android_apk).is_file():
              raise SystemExit(f"应用内更新签名不完整，缺少 Android 签名或文件：{android_apk}")

          platforms = {
              key: {"url": base + name, "signature": signatures[name]}
              for key, name in desktop_packages.items()
          }
          platforms["android-aarch64"] = {"url": base + android_apk, "signature": signatures[android_apk]}

          manifest = {
              "version": ver,
              "notes": f"MOSS {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          (dist / "latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          # END LATEST_JSON_GENERATOR

      - name: Generate SHA256SUMS & release notes
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS.txt
          cd ..

          # BEGIN RELEASE_NOTES_GENERATOR
          python3 - "$VERSION" "$TAG" "$SIDECAR_READY" "$GITHUB_REPOSITORY" > release-notes.md <<'PY'
          import pathlib, re, subprocess, sys

          ver, tag, sidecar_ready, repo = sys.argv[1:5]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", re.M | re.S)
          m = pattern.search(changelog)
          body = m.group(1).strip() if m else ""
          if not body:
              prev = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  capture_output=True, text=True
              )
              rev_range = f"{prev.stdout.strip()}..{tag}" if prev.returncode == 0 and prev.stdout.strip() else tag
              commits = subprocess.run(
                  ["git", "log", "--pretty=format:- %s (%h)", rev_range],
                  capture_output=True, text=True
              ).stdout.strip()
              body = commits or f"- 发布 MOSS {tag}"

          gate_note = ""
          if sidecar_ready != "true":
              gate_note = (
                  "\n\n> 说明：离线语音辅助程序（`moss-voice-local`）原生静态依赖许可与对应源码审计尚未闭环（见 `docs/developer/safety.md`），"
                  "本次仅发布不含离线语音 sidecar 的普通安装包；为避免已有含离线语音的 macOS 安装被应用内更新整包替换后丢失离线语音，本次不发布 macOS 应用内更新目标（Windows 轻量版与 Android 照常提供应用内更新）。\n"
              )

          sums = pathlib.Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip()
          header = f"## MOSS {tag}\n\n"
          footer = f"{gate_note}\n### SHA-256 校验和\n\n```text\n{sums}\n```"
          # GitHub Release 正文硬上限 125,000 字符；留足余量，超长时按行截断并附完整 CHANGELOG 链接
          max_notes_chars = 110_000
          changelog_url = f"https://github.com/{repo}/blob/{tag}/CHANGELOG.md"
          truncation_notice = f"\n\n> 变更条目较长，以上为近期摘要；完整更新记录见 [CHANGELOG.md]({changelog_url})。"
          max_body_chars = max(2000, max_notes_chars - len(header) - len(footer) - len(truncation_notice))
          if len(body) > max_body_chars:
              kept = []
              total = 0
              for line in body.splitlines():
                  step = len(line) + 1
                  if total + step > max_body_chars:
                      break
                  kept.append(line)
                  total += step
              kept_text = "\n".join(kept).rstrip() if kept else body[:max_body_chars].rstrip()
              body = f"{kept_text}{truncation_notice}"
          print(f"{header}{body}{footer}")
          PY
          # END RELEASE_NOTES_GENERATOR

      - name: Create or update GitHub Release
        run: |
          if [[ "$SIDECAR_READY" == "true" ]]; then
            MAC_LABEL="macOS 通用版安装包 (Apple Silicon + Intel，含离线语音)"
          else
            MAC_LABEL="macOS 通用版安装包 (Apple Silicon + Intel，不含离线语音)"
          fi
          ASSETS=(
            "dist/MOSS_${VERSION}_x64-lite-setup.exe#Windows 轻量版安装包"
            "dist/MOSS_${VERSION}_windows_x64_portable.exe#Windows 单文件免安装便携版 (x64)"
            "dist/MOSS_${VERSION}_macos_universal.dmg#${MAC_LABEL}"
            "dist/MOSS_${VERSION}_android_aarch64.apk#Android 手机端安装包 (arm64)"
            "dist/SHA256SUMS.txt#SHA-256 校验清单"
          )
          if [[ "$SIDECAR_READY" == "true" ]]; then
            ASSETS+=(
              "dist/MOSS_${VERSION}_x64-offline-voice-setup.exe#Windows 完整版安装包（含离线语音辅助程序）"
              "dist/moss-voice-local-${VERSION}-gpl-source.zip#离线语音辅助程序对应源码与许可清单 (GPLv3)"
            )
          fi
          if [[ "$SIDECAR_READY" == "true" && -f "dist/MOSS_${VERSION}_macos_universal.app.tar.gz" ]]; then
            ASSETS+=(
              "dist/MOSS_${VERSION}_macos_universal.app.tar.gz#macOS 应用内更新包（由 MOSS 自动下载，无需手动安装）"
            )
          fi
          if [[ -f dist/latest.json ]]; then
            ASSETS+=(
              "dist/latest.json#应用内更新清单"
            )
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag \
              --title "MOSS $TAG" \
              --notes-file release-notes.md \
              --latest
          fi
