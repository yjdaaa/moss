name: MOSS Multi-Platform CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # 1. 前端构建与测试
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          node --test ../scripts/tests/*.test.mjs
          npm run build
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # 1b. Rust 格式与静态检查（2026-11-07）：在 macOS 上跑，与本机验证平台一致；
  #     Windows / Android 专属代码暂不在这里检查
  rust-lint:
    needs: frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: |
          cargo fmt --all -- --check
          (cd apps/moss-voice-local && cargo fmt --all -- --check)
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          (cd apps/moss-voice-local && cargo clippy --all-targets -- -D warnings)
      - name: Run macOS Workspace & Helper Tests
        run: |
          cargo test --workspace
          (cd apps/moss-voice-local && cargo test)

  # 2. Rust Workspace 核心检查与 Windows 桌面构建
  windows-desktop:
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Windows Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Workspace Tests
        run: cargo test --workspace
      - name: Build Release moss-desktop & moss-host
        run: |
          cargo build --release -p moss-host
          cargo build --release -p moss-desktop --features tauri/custom-protocol
      - name: Run Loopback FakeGrbl API E2E
        run: node scripts/test_e2e.mjs --api-only
      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: moss-windows-binaries
          path: |
            target/release/moss-desktop.exe
            target/release/moss-host.exe

  # 3. Android APK 云端编译校验
  android-build:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - name: Setup Android SDK & NDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build Android APK
        run: |
          cd apps/desktop/src-tauri
          cargo tauri android build --debug --target aarch64 --apk --ci --config '{"build":{"beforeBuildCommand":""}}'
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: moss-android-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
