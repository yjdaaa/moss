[package]
name = "moss-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "moss_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri.workspace = true
laser-host = { path = "../../../crates/laser-host" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
minisign-verify = "0.3"
reqwest.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
# 导出目录选择与“另存为”框（技术书 §9.7）；Android 本期不做
tauri-plugin-dialog = "2"
# 语音中心与内置语音宿主编排（零 UI 逻辑下沉到 crates/moss-voice-host）；Android 不编译（A-69）
moss-voice = { path = "../../../crates/moss-voice" }
moss-voice-server = { path = "../../../crates/moss-voice-server" }
moss-voice-host = { path = "../../../crates/moss-voice-host" }
tauri-plugin-updater = "2"

[dev-dependencies]
# 测试不读写 macOS 真实登录钥匙串（见 laser-runtime 的 test-memory-secret-store）
laser-runtime = { path = "../../../crates/laser-runtime", features = ["test-memory-secret-store", "test-sql-access"] }
tempfile.workspace = true
tauri = { workspace = true, features = ["test"] }
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
flate2.workspace = true
tar.workspace = true

[lints]
workspace = true
