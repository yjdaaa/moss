[workspace]
resolver = "2"
members = [
    "apps/moss-host",
    "apps/desktop/src-tauri",
    "crates/laser-api",
    "crates/laser-contracts",
    "crates/laser-core",
    "crates/laser-device",
    "crates/laser-host",
    "crates/laser-mcp",
    "crates/laser-runtime",
    "crates/laser-tools",
    "crates/moss-agent",
    "crates/moss-home",
    "crates/moss-mcp-client",
    "crates/moss-process",
    "crates/moss-usb-provision",
    "crates/moss-voice",
    "crates/moss-voice-local-proto",
    "crates/moss-voice-providers",
    "crates/moss-voice-server",
    "crates/moss-voice-host",
    "crates/moss-xiaozhi-display",
    "crates/moss-xiaozhi-proto",
]

[workspace.package]
version = "0.3.11"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false }
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
hex = "0.4"
if-addrs = "0.13"
image = { version = "0.25", default-features = false }
mdns-sd = "0.13"
rcgen = "0.13"
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = [] }
tempfile = "3"
tokio = "1"
tokio-tungstenite = { version = "0.29", default-features = false }
tungstenite = { version = "0.29", default-features = false }
url = "2"
webpki-roots = "1"
windows-sys = "0.59"

# 2026-11-07 起 CI 以 `cargo clippy --workspace --all-targets -- -D warnings` 把关。
# 下面几项是结构层面的提示（复杂类型、枚举体积），留给后续拆分大文件时处理，不在日常改动中阻塞；
# 参数个数上限见根目录 clippy.toml。
[workspace.lints.clippy]
type_complexity = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev]
debug = "line-tables-only"

