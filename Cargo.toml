[workspace]
resolver = "2"
members = [
    "apps/moss-host",
    "apps/desktop/src-tauri",
    "crates/laser-api",
    "crates/laser-contracts",
    "crates/laser-core",
    "crates/laser-device",
    "crates/laser-host",
    "crates/laser-mcp",
    "crates/laser-runtime",
    "crates/laser-tools",
    "crates/moss-mcp-client",
    "crates/moss-voice",
    "crates/moss-voice-local-proto",
    "crates/moss-voice-providers",
    "crates/moss-voice-server",
    "crates/moss-xiaozhi-proto",
]

# 2026-11-07 起 CI 以 `cargo clippy --workspace --all-targets -- -D warnings` 把关。
# 下面几项是结构层面的提示（复杂类型、枚举体积），留给后续拆分大文件时处理，不在日常改动中阻塞；
# 参数个数上限见根目录 clippy.toml。
[workspace.lints.clippy]
type_complexity = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev]
debug = "line-tables-only"

